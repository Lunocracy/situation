<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Dossier & Enterprise Valuation Assessment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      background: #070a12 !important;
      color: #cbd5e1;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    #app-root {
      width: 100%;
      min-height: 100vh;
    }
  </style>
  <script src="library/AppLoader.js"></script>
</head>
<body>
  <div id="app-root"></div>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (typeof AppLoader !== "undefined") {
        AppLoader.loadApp("app-root");
      }
    });
  </script>
</body>
</html>
